apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veritrail-ingress
  namespace: veritrail
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - veritrail.example.com
      secretName: veritrail-tls
  rules:
    - host: veritrail.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: veritrail-server
                port:
                  number: 8787
          - path: /
            pathType: Prefix
            backend:
              service:
                name: veritrail-console
                port:
                  number: 80
