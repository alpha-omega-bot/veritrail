apiVersion: apps/v1
kind: Deployment
metadata:
  name: veritrail-server
  namespace: veritrail
  labels:
    app: veritrail-server
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: veritrail-server
  template:
    metadata:
      labels:
        app: veritrail-server
        component: backend
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8787'
        prometheus.io/path: '/api/metrics/prometheus'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: server
          image: veritrail/server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          envFrom:
            - configMapRef:
                name: veritrail-server-config
            - secretRef:
                name: veritrail-server-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: veritrail-data
---
apiVersion: v1
kind: Service
metadata:
  name: veritrail-server
  namespace: veritrail
  labels:
    app: veritrail-server
spec:
  type: ClusterIP
  ports:
    - port: 8787
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: veritrail-server
