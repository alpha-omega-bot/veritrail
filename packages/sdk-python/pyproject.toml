[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "veritrail"
version = "0.1.0"
description = "Official Python SDK for the Veritrail audit and policy server."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Veritrail", email = "engineering@veritrail.dev" },
]
keywords = ["veritrail", "audit", "policy", "ai-governance", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://veritrail.dev"
Documentation = "https://veritrail.dev/docs"
Repository = "https://github.com/veritrail/veritrail"
Issues = "https://github.com/veritrail/veritrail/issues"

[tool.hatch.build.targets.wheel]
packages = ["veritrail"]

[tool.hatch.build.targets.sdist]
include = [
  "veritrail",
  "tests",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
