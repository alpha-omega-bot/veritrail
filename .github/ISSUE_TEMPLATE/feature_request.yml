name: Feature request
description: Propose a capability or improvement
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who has it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: capability
    attributes:
      label: Related capability
      options:
        - Audit
        - Rollback
        - Permissions
        - Spend Guard
        - Incident Forensics
        - Evidence Tracing
        - Decision Memory
        - Vendor Risk
        - Platform / core
    validations:
      required: true
